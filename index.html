<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生歷史溫習系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .quiz-card { background: white; width: 100%; max-width: 650px; padding: 40px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
    .chapter-badge { display: inline-block; background: #e8f2ff; color: #0071e3; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; }
    .progress-text { font-size: 0.9rem; color: #86868b; margin-bottom: 20px; }
    .question-title { font-size: 1.3rem; line-height: 1.5; color: #1d1d1f; margin-bottom: 25px; text-align: justify; white-space: pre-line; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; }
    .option-btn { background: #f5f5f7; border: 2px solid transparent; padding: 14px 20px; border-radius: 12px; font-size: 1rem; color: #1d1d1f; text-align: left; cursor: pointer; transition: all 0.2s ease; }
    .option-btn:hover:not(:disabled) { background: #e8e8ed; }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
    .explanation-box { margin-top: 20px; padding: 15px 20px; border-radius: 12px; text-align: left; font-size: 0.95rem; line-height: 1.5; display: none; }
    .explanation-box.correct { background: #eafbe7; color: #1e7e34; border: 1px solid #c3e6cb; }
    .explanation-box.wrong { background: #fdf2f2; color: #dc3545; border: 1px solid #f5c6cb; }
    .action-btn { margin-top: 25px; background: #34c759; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="quiz-card" id="quiz-container">
    <div id="quiz-content">
      <span class="chapter-badge" id="chapter-tag">歷史知識測驗</span>
      <div class="progress-text" id="progress-tag">第 0 / 0 題</div>
      <div class="question-title" id="question-text">載入題庫中...</div>
      <div class="options-grid" id="options-box"></div>
      <div class="explanation-box" id="explain-box"></div>
      <button class="action-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">下一題</button>
    </div>
  </div>

  <script>
    let rawQuestions = [];
    let quizQuestions = [];
    let currentIndex = 0;
    let score = 0;

    window.addEventListener('DOMContentLoaded', loadData);

    async function loadData() {
      // 加上時間戳記 prevent cache (防止瀏覽器快取舊的無效 JSON)
      const cacheBuster = `?t=${new Date().getTime()}`;
      const paths = [`questions.json${cacheBuster}`, `./questions.json${cacheBuster}`];
      let loaded = false;

      for (const path of paths) {
        try {
          const response = await fetch(path);
          if (response.ok) {
            rawQuestions = await response.json();
            loaded = true;
            break;
          }
        } catch (e) {
          console.warn(`讀取 ${path} 失敗:`, e);
        }
      }

      if (loaded && Array.isArray(rawQuestions) && rawQuestions.length > 0) {
        initQuiz();
      } else {
        // 嘗試備用本地快取
        const storedData = localStorage.getItem('quiz_questions');
        if (storedData) {
          try {
            rawQuestions = JSON.parse(storedData);
            if (rawQuestions.length > 0) {
              initQuiz();
              return;
            }
          } catch(e) {}
        }
        document.getElementById('question-text').innerText = '❌ 無法載入題庫：請確認 questions.json 檔案內容是否為空，或 JSON 格式是否正確。';
      }
    }

    function initQuiz() {
      if (!rawQuestions || rawQuestions.length === 0) {
        document.getElementById('question-text').innerText = '題庫內容為空。';
        return;
      }
      // 隨機抽 20 題（若不足 20 題則全部顯示）
      quizQuestions = [...rawQuestions].sort(() => 0.5 - Math.random()).slice(0, 20);
      currentIndex = 0;
      score = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizQuestions[currentIndex];
      
      // 1. 章節名稱相容處理
      document.getElementById('chapter-tag').innerText = q.chapter || q.category || '歷史題庫';
      document.getElementById('progress-tag').innerText = `第 ${currentIndex + 1} / ${quizQuestions.length} 題`;
      
      // 2. 題目內容相容處理
      const qTitle = q.title || q.question || q.q || '無題目內容';
      document.getElementById('question-text').innerText = qTitle;

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';
      
      // 3. 選項相容處理 (陣列/物件均可)
      const rawOptions = q.options || q.choices || q.answers;
      let optionsList = [];

      if (Array.isArray(rawOptions)) {
        const keys = ['A', 'B', 'C', 'D', 'E'];
        optionsList = rawOptions.map((opt, idx) => ({
          key: keys[idx] || String(idx + 1),
          text: opt
        }));
      } else if (typeof rawOptions === 'object' && rawOptions !== null) {
        optionsList = Object.keys(rawOptions).map(key => ({
          key: key,
          text: rawOptions[key]
        }));
      }

      // 渲染選項按鈕
      optionsList.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        let rawText = String(item.text).trim();
        let cleanText = rawText.replace(/^[A-Da-d1-5][.\s、:]+/, '').trim();

        btn.innerText = `${item.key}. ${cleanText}`;
        btn.onclick = () => checkAnswer(item.key, item.text);
        optionsBox.appendChild(btn);
      });

      const explainBox = document.getElementById('explain-box');
      explainBox.style.display = 'none';
      explainBox.className = 'explanation-box';
      document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedKey, selectedText) {
      const q = quizQuestions[currentIndex];
      const explainBox = document.getElementById('explain-box');
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.disabled = true);

      // 解析文字清理
      let rawExplain = q.explanation || q.explain || q.detail || '暫無解析';
      let cleanExplanation = String(rawExplain)
        .replace(/\[\/?cite[^\]]*\]/gi, '')
        .trim();

      // 正確答案相容處理
      const targetAnswer = String(q.answer || q.correct || '').trim();
      const isCorrect = (selectedKey.toUpperCase() === targetAnswer.toUpperCase()) || 
                        (selectedText.trim() === targetAnswer) ||
                        (selectedKey === targetAnswer);

      if (isCorrect) {
        score++;
        explainBox.innerHTML = `<strong>✅ 回答正確！</strong><br>${cleanExplanation}`;
        explainBox.classList.add('correct');
      } else {
        explainBox.innerHTML = `<strong>❌ 回答錯誤（正確答案：${targetAnswer}）</strong><br>${cleanExplanation}`;
        explainBox.classList.add('wrong');
      }

      explainBox.style.display = 'block';
      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = (currentIndex === quizQuestions.length - 1) ? '查看總結成績' : '下一題';
      nextBtn.style.display = 'inline-block';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizQuestions.length) {
        renderQuestion();
      } else {
        showFinalResult();
      }
    }

    function showFinalResult() {
      const quizContainer = document.getElementById('quiz-container');
      const finalScore = Math.round((score / quizQuestions.length) * 100);
      
      quizContainer.innerHTML = `
        <div style="padding: 20px 0;">
          <h2 style="font-size: 2rem; margin-bottom: 15px;">🎉 測驗完成</h2>
          <p style="font-size: 1.2rem; color: #86868b; margin-bottom: 25px;">你的得分是：<strong style="color: #0071e3; font-size: 2.5rem;">${finalScore}</strong> 分</p>
          <p style="margin-bottom: 30px;">答對 ${score} / ${quizQuestions.length} 題</p>
          <button class="action-btn" onclick="location.reload()">再測驗一次</button>
        </div>
      `;
    }
  </script>
</body>
</html>
